name: Update Media Pulse

on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 (UTC)
  workflow_dispatch:              # "Run workflow" button = update now
    inputs:
      gdelt:
        description: "Also pull regional GDELT data now (takes ~15 min)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write                 # commit new articles to data/
  pages: write                    # publish the dashboard
  id-token: write

concurrency:
  group: media-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s pipeline/tests

      - name: Fetch feeds and rebuild dashboard data
        env:
          MP_GDELT_FORCE: ${{ inputs.gdelt && '1' || '0' }}
        run: python pipeline/run.py

      - name: Save new articles to the repository
        run: |
          git config user.name "media-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
